apiVersion: v1
kind: ConfigMap
metadata:
  name: mdl-config
data:
  config.yaml: |
    {{- /* Wire the decrypt / m3u8 ports to the wrapper service automatically. */}}
    {{- $cfg := deepCopy .Values.mdl.config }}
    {{- $_ := set $cfg "decrypt-m3u8-port" (printf "mdl-wrapper-svc:%v" .Values.wrapper.decryptPort) }}
    {{- $_ := set $cfg "get-m3u8-port" (printf "mdl-wrapper-svc:%v" .Values.wrapper.m3u8Port) }}
    {{- toYaml $cfg | nindent 4 }}
