# mdl - music search & download service
# https://github.com/dseif0x/mdl
# The mdl image bundles an HTTP server (web UI + REST API) plus yt-dlp
# (YouTube/SoundCloud) and apple-music-dl (Apple Music). apple-music-dl still
# talks to the wrapper decryption service below, wired via the rendered
# config.yaml (see mdl-configmap.yaml).
mdl:
  image: ghcr.io/dseif0x/mdl:latest
  imagePullPolicy: Always
  # Port the HTTP server listens on inside the container (MDL_ADDR).
  port: 8080
  # Where downloads are written inside the container (MDL_DOWNLOAD_DIR). Keep
  # the Apple Music *-save-folder paths in `config` below under this path so
  # those downloads also land on the NFS share.
  mountPath: /downloads
  # The mdl image (and the bundled apple-music-dl / wrapper) are published for
  # linux/amd64 only, so pin scheduling to amd64 nodes. Override/clear this
  # only if an arm64 image becomes available.
  nodeSelector:
    kubernetes.io/arch: amd64
  # NFS share holding the downloaded music.
  nfs:
    server: cp0.seifert.id
    path: /mnt/hdd_huge/
    subPath: applemusic
    readOnly: false
  # Run as a non-root user instead of root. fsGroup makes the NFS download
  # mount group-writable for this user. Set to {} to run as root.
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  # Expose the web UI / API outside the cluster. Disabled by default.
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: mdl.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: mdl-tls
      #   hosts:
      #     - mdl.example.com
  # Extra environment variables for the mdl server, e.g.
  #   - name: MDL_DOWNLOAD_WORKERS
  #     value: "4"
  extraEnv: []
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
  # Rendered verbatim to /app/config.yaml inside the container, where the
  # bundled apple-music-dl reads it. The `decrypt-m3u8-port` / `get-m3u8-port`
  # keys are wired to the wrapper service automatically (see mdl-configmap.yaml),
  # so don't set them here. All other upstream config.yaml options can be
  # added/overridden below.
  # https://github.com/zhaarey/apple-music-downloader/blob/main/config.yaml
  config:
    media-user-token: "your-media-user-token" # If you need to obtain lyrics and aac-lc, change it
    authorization-token: "your-authorization-token" # You don't need to change it; it can automatically obtain token
    language: ""         # supportedLanguage by each storefront --> https://gist.github.com/itouakirai/c8ba9df9dc65bd300094103b058731d0
    lrc-type: "lyrics"   # lyrics or syllable-lyrics
    lrc-format: "lrc"    # lrc or ttml
    embed-lrc: true
    save-lrc-file: false
    save-artist-cover: false
    save-animated-artwork: false    # If enabled, requires ffmpeg
    emby-animated-artwork: false    # If enabled, requires ffmpeg
    embed-cover: true
    cover-size: 5000x5000
    cover-format: jpg       # jpg png or original
    tag-sort-order: true
    tag-itunes-id: true
    # Save folders are absolute so Apple Music downloads land on the NFS mount
    # (mdl.mountPath) alongside the yt-dlp downloads. Keep them under that path.
    alac-save-folder: /downloads/ALAC
    atmos-save-folder: /downloads/Atmos
    aac-save-folder: /downloads/AAC
    mv-save-folder: /downloads/MV
    max-memory-limit: 256 # MB
    get-m3u8-from-device: true
    # set to 'true' to exit on error instead of requiring manual intervention. (for using this program in scripts)
    exit-on-error: false
    # set 'all' to retrieve all m3u8, and set 'hires' to only detect hires m3u8.
    get-m3u8-mode: hires # all hires
    aac-type: aac-lc # aac-lc aac aac-binaural aac-downmix
    alac-max: 192000  # 192000 96000 48000 44100
    atmos-max: 2768  # 2768 2448
    limit-max: 200
    # {AlbumId} {AlbumName} {ArtistName} {ReleaseDate} {ReleaseYear} {UPC} {Copyright} {Quality} {Codec} {Tag} {RecordLabel}
    # example: {ReleaseYear} - {ArtistName} - {AlbumName}({AlbumId})({UPC})({Copyright}){Codec}
    album-folder-format: "{AlbumName}"
    # {PlaylistId} {PlaylistName} {ArtistName} {Quality} {Codec} {Tag}
    playlist-folder-format: "{PlaylistName}"
    # {SongId} {SongNumer} {SongName} {DiscNumber} {TrackNumber} {Quality} {Codec} {Tag}
    # example: Disk {DiscNumber} - Track {TrackNumber} {SongName} [{Quality}]{{Tag}}
    song-file-format: "{SongNumer}. {SongName}"
    # {ArtistId} {ArtistName}/{UrlArtistName}
    # if artist-folder-format set "",will not make artist folder
    artist-folder-format: "{UrlArtistName}"
    # if set "" will not add tag
    explicit-choice: "[E]"
    clean-choice: "[C]"
    apple-master-choice: "[M]"
    # if set true,for playlst,will use songinfo for meta #albumname track disk
    use-songinfo-for-playlist: false
    # if set true,will download album cover for playlist
    dl-albumcover-for-playlist: false
    mv-audio-type: atmos  # atmos ac3 aac
    mv-max: 2160
    # storefront will be used only in searching.
    # storefront is the 2-letter country code that are available in the urls (jp, ca, us etc.).
    # if your account is from Japan, you must use jp.
    # if the storefront is different from your account, you will see a "failed to get lyrics" error in most of the songs. By default the storefront is set to US if not set.
    storefront: "enter your account storefront"
    alac-fix: false                   # Patch malformed ALAC packets
    # Conversion settings
    convert-after-download: false     # Enable post-download conversion (requires ffmpeg)
    convert-format: "flac"            # flac | mp3 | opus | wav | copy (no re-encode)
    convert-keep-original: false      # Keep original file after successful conversion
    convert-skip-if-source-matches: true  # If already in target format, skip
    ffmpeg-path: "ffmpeg"             # Override if ffmpeg is not in PATH
    convert-extra-args: ""            # Additional raw args appended (advanced)
    convert-with-metadata: true       # If true, keep the same metadata in converted files
    # Conversion warnings and behavior
    convert-warn-lossy-to-lossless: true # If true, print a warning when converting a detected lossy source to a lossless container
    convert-skip-lossy-to-lossless: true # If true, skip converting detected lossy sources to lossless target formats (flac/wav)
    convert-check-bad-alac: false # If true, check and report if ALAC is damaged
    convert-delete-bad-alac: false # If true, delete if ALAC is damaged

# wrapper (decryption dependency)
# https://github.com/WorldObservationLog/wrapper
wrapper:
  image: ghcr.io/worldobservationlog/wrapper:local
  imagePullPolicy: Always
  # Passed to the wrapper via the `args` env var. Bind to all interfaces so the
  # downloader pod can reach the decrypt/m3u8/account services.
  args: "-H 0.0.0.0"
  # The wrapper emulates an Android device and is published for linux/amd64
  # only, so pin scheduling to amd64 nodes. Override/clear only if an arm64
  # image becomes available.
  nodeSelector:
    kubernetes.io/arch: amd64
  # Service ports exposed by the wrapper.
  decryptPort: 10020
  m3u8Port: 20020
  accountPort: 30020
  # The wrapper emulates an Android device and needs a privileged container.
  privileged: true
  # Persistent storage for /app/rootfs/data (login state / device data).
  storage:
    size: 2Gi
    storageClassName: nfs-fast
    accessMode: ReadWriteOnce
    mountPath: /app/rootfs/data
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "2000m"
