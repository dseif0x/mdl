<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mdl &middot; music downloader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>mdl</h1>
    <p class="tagline">search, browse &amp; download from multiple music providers</p>
  </header>

  <main>
    <section class="panel">
      <form id="search-form">
        <select id="provider" aria-label="Provider"></select>
        <select id="type" aria-label="Search type"></select>
        <input id="query" type="text" placeholder="Search…" autocomplete="off" />
        <button type="submit">Search</button>
      </form>

      <details class="url-download">
        <summary>Download by URL</summary>
        <form id="url-form">
          <select id="url-provider" aria-label="Provider for URL"></select>
          <input id="url-input" type="url" placeholder="https://… (track, album or artist)" />
          <button type="submit">Download</button>
        </form>
      </details>
    </section>

    <nav id="breadcrumb" class="breadcrumb" hidden></nav>
    <p id="status" class="status" role="status"></p>
    <ul id="results" class="results"></ul>

    <section id="jobs-panel" class="jobs-panel" hidden>
      <h2>Downloads</h2>
      <ul id="jobs" class="jobs"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
