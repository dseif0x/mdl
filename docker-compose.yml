services:
  # mdl: REST API + web UI for searching and downloading music. The image
  # bundles yt-dlp (YouTube/SoundCloud) and apple-music-dl (Apple Music), so a
  # single container handles all providers.
  mdl:
    build: .
    image: ghcr.io/dseif0x/mdl:latest
    container_name: mdl
    ports:
      - "8080:8080"
    environment:
      MDL_ADDR: ":8080"
      MDL_DOWNLOAD_DIR: "/downloads"
      # apple-music-dl is on PATH inside the image; the default already works.
      MDL_APPLEMUSIC_CMD: "apple-music-dl"
    volumes:
      - ./downloads:/downloads
    restart: unless-stopped
